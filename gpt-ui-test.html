<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>雲深後山 GPT UI 測試版</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#131e18}iframe{width:100%;height:100%;border:0;display:block}#err{display:none;position:fixed;inset:12px;background:#1b2b22;color:#f3efd6;padding:20px;z-index:5;font-family:system-ui}</style></head><body><iframe id="game" src="./index.html" title="雲深後山原版遊戲"></iframe><div id="err"></div><script>const patch="/* 雲深後山 UI 修補 v0.2 — 僅調整版面，不更動遊戲按鍵與戰鬥事件 */\n(() => {\n  'use strict';\n  const css = `\n  /* iOS / landscape: compact, scroll-safe panels */\n  .floating-panel { width:min(620px, calc(100% - 24px)); max-height:min(82dvh, calc(100% - 24px)); overflow-y:auto; overscroll-behavior:contain; scrollbar-gutter:stable; padding:14px; }\n  #gear-menu { display:flex; flex-direction:column; overflow:hidden; }\n  #gear-menu[hidden] { display:none!important; }\n  #gear-menu .panel-head { flex:0 0 auto; position:relative; z-index:2; background:#1b2b22; flex-wrap:wrap; gap:8px; }\n  #gear-menu .panel-head>div { display:flex; flex-wrap:wrap; gap:6px!important; }\n  #gear-equipment, #gear-skills { min-height:0; overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; padding:4px 4px 20px; }\n  #gear-equipment[hidden], #gear-skills[hidden] {display:none!important;}\n  .floating-panel select { min-width:0; max-width:100%; width:100%; }\n  .gear-grid {grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));}\n  .hud-tools { gap:5px; }\n  .hud-tools button { white-space:nowrap; }\n  .action-cluster button { min-height:44px; }\n  .action-cluster button[hidden] { display:none!important; }\n  @media (pointer:coarse) {\n    .controls { flex:0 0 auto; padding:7px max(8px, env(safe-area-inset-right)) 7px max(8px, env(safe-area-inset-left)); gap:10px; }\n    .dpad { grid-template-columns:repeat(3, 48px);grid-template-rows:repeat(2,46px);gap:5px;flex:0 0 auto; }\n    .action-cluster {display:grid;grid-template-columns:repeat(4,minmax(48px,1fr));gap:5px;max-width:min(440px,calc(100% - 164px));align-content:center;}\n    .action-cluster button {min-width:0; min-height:44px; padding:4px 3px; font-size:12px;}\n    .action-cluster button small {font-size:10px;}\n    .action-cluster [data-control='slash'] {grid-column:4;grid-row:1 / span 2;}\n    .action-cluster [data-control='jump'] {grid-column:3;grid-row:1;}\n    .action-cluster [data-control='dodge'] {grid-column:3;grid-row:2;}\n    .action-cluster [data-control='skill'] {grid-column:1;grid-row:1;}\n    .action-cluster [data-control='charm'] {grid-column:2;grid-row:1;}\n    .action-cluster [data-control='swap'] {grid-column:2;grid-row:2;}\n    .action-cluster [data-control='gather'] {grid-column:1;grid-row:2;}\n    .action-cluster [data-control='chant'],.action-cluster [data-control='flight'] {display:none;}\n    .action-cluster [data-control^='quick'] {display:none;}\n    .action-cluster.ui-expanded [data-control='chant'],.action-cluster.ui-expanded [data-control='flight'],.action-cluster.ui-expanded [data-control^='quick'] {display:flex;grid-column:auto;grid-row:auto;}\n    .action-cluster.ui-expanded {grid-template-columns:repeat(4,minmax(48px,1fr));}\n    .action-cluster.ui-expanded [data-control='slash'],.action-cluster.ui-expanded [data-control='jump'],.action-cluster.ui-expanded [data-control='dodge'],.action-cluster.ui-expanded [data-control='skill'],.action-cluster.ui-expanded [data-control='charm'],.action-cluster.ui-expanded [data-control='swap'],.action-cluster.ui-expanded [data-control='gather'] {grid-column:auto;grid-row:auto;}\n    .controls {position:relative;}\n    #ui-more-actions {position:absolute;right:max(8px,env(safe-area-inset-right));top:-37px;z-index:11;min-height:33px;padding:3px 12px;font-size:12px;background:#203d31;border:1px solid #a8c6a9;}\n    .floating-panel {position:fixed; top:50%;left:50%;width:min(660px,calc(100vw - 28px));max-height:calc(100dvh - 24px);transform:translate(-50%,-50%);z-index:100;}\n    #gear-menu {max-height:calc(100dvh - 24px);}\n  }\n  @media (pointer:coarse) and (orientation:landscape) and (max-height:520px) {\n    .hud-bar {padding:3px 9px;gap:4px;}\n    .vitals {gap:4px;}\n    .stat-pill {font-size:11px;padding:2px 7px;}\n    .hud-tools button {font-size:11px;padding:3px 8px;}\n    .banner-strip {padding:2px 8px;font-size:11px;}\n    .controls {padding-top:4px;padding-bottom:4px;}\n    .dpad {grid-template-columns:repeat(3,42px);grid-template-rows:repeat(2,38px);}\n    .action-cluster {max-width:min(410px,calc(100% - 148px));}\n    .action-cluster button {min-height:37px;}\n    .stage-wrap {min-height:80px;}\n  }\n  `;\n  const style = document.createElement('style'); style.id='houshan-ui-patch'; style.textContent=css; document.head.appendChild(style);\n  const controls=document.querySelector('.controls');\n  const cluster=document.querySelector('.action-cluster');\n  if(controls&&cluster){\n    const more=document.createElement('button');\n    more.id='ui-more-actions';more.type='button';more.textContent='更多操作 ＋';more.setAttribute('aria-expanded','false');\n    more.addEventListener('click',()=>{const expanded=cluster.classList.toggle('ui-expanded');more.textContent=expanded?'收起操作 −':'更多操作 ＋';more.setAttribute('aria-expanded',String(expanded));});\n    controls.appendChild(more);\n  }\n})();\n";document.getElementById('game').addEventListener('load',function(){try{const doc=this.contentDocument;if(!doc)throw Error('不同網域');const script=doc.createElement('script');script.textContent=patch;doc.body.appendChild(script);doc.title='雲深後山・GPT UI 測試版';}catch(e){const el=document.getElementById('err');el.style.display='block';el.textContent='UI 測試補丁載入失敗：'+e.message;}});</script></body></html>
